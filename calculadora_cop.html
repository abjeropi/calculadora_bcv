<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio VES a COP</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
        body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .container { background-color: rgba(45, 45, 45, 0.95); padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #FFCD00; margin-top: 0; font-size: 1.8em; }
        .tasa-info { text-align: center; font-size: 0.9em; background-color: #1e1e1e; padding: 10px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #FFCD00; }
        .tasa-principal { font-size: 1.3em; margin: 5px 0; }
        .fecha-actualizacion { font-size: 0.8em; color: #888; margin-top: 5px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #ccc; }
        input[type="number"] { width: 100%; padding: 14px; font-size: 1.3em; border: 2px solid #444; border-radius: 10px; background-color: #1e1e1e; color: white; box-sizing: border-box; }
        input[type="number"]:focus { border-color: #FFCD00; }
        .ajuste-container { background-color: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .ajuste-header { font-size: 0.9em; color: #FFCD00; font-weight: bold; margin-bottom: 10px; }
        .tasa-actual { font-size: 1.5em; text-align: center; margin: 10px 0; color: #FFCD00; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #FFCD00; }
        .ajuste-rapido { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .ajuste-rapido button { flex: 1; min-width: 60px; padding: 8px; border: none; border-radius: 6px; background-color: #444; color: white; cursor: pointer; font-size: 0.85em; }
        .ajuste-rapido button.active { background-color: #FFCD00; color: #1e1e1e; }
        .refresh-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background-color: #FFCD00; color: #1e1e1e; margin-top: 10px; }
        .alert { background-color: #ff5722; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇨🇴 Cambio VES a COP</h2>
    <div class="alert" id="alert">️ Error</div>
    
    <div class="tasa-info">
        <div class="tasa-principal" id="tasa-display">Cargando...</div>
        <div class="fecha-actualizacion" id="fecha-display"></div>
    </div>

    <div class="ajuste-container">
        <div class="ajuste-header">Tasa de cambio (COP por Bolívar)</div>
        <div class="tasa-actual" id="tasa-actual-display">--</div>
        <input type="range" id="ajuste-slider" min="0" max="100" value="50" step="1">
        <div class="ajuste-rapido" id="botones-rapidos"></div>
    </div>
    
    <div class="input-group">
        <label for="ves">🇻🇪 Bolívares (VES)</label>
        <input type="number" id="ves" placeholder="0.00">
    </div>

    <div class="input-group">
        <label for="cop">🇨🇴 Pesos Colombianos (COP)</label>
        <input type="number" id="cop" placeholder="0.00">
    </div>

    <button class="refresh-btn" onclick="cargarTasas()">🔄 Actualizar</button>
</div>

<script>
    // API del Banco de la República de Colombia (oficial)
    const API_COP_URL = "https://open.er-api.com/v6/latest/USD";
    const TASA_USDTVES_URL = "https://raw.githubusercontent.com/abjeropi/calculadora_bcv/main/tasa_usdtves.csv";

    let tasaBase = 0, tasaActual = 0;
    const vesInput = document.getElementById('ves');
    const copInput = document.getElementById('cop');
    const tasaDisplay = document.getElementById('tasa-display');
    const fechaDisplay = document.getElementById('fecha-display');
    const slider = document.getElementById('ajuste-slider');
    const tasaActualDisplay = document.getElementById('tasa-actual-display');
    const botonesRapidos = document.getElementById('botones-rapidos');
    const alertBox = document.getElementById('alert');

    window.onload = cargarTasas;

    slider.addEventListener('input', () => {
        const minTasa = Math.max(0, tasaBase - 1.0);
        const maxTasa = tasaBase + 1.0;
        tasaActual = minTasa + (parseInt(slider.value) / 100) * (maxTasa - minTasa);
        tasaActualDisplay.innerText = tasaActual.toFixed(1); // 1 DECIMAL
        if (vesInput.value) vesInput.dispatchEvent(new Event('input'));
    });

    async function cargarTasas() {
        tasaDisplay.innerText = "🔄 Obteniendo tasas...";
        alertBox.style.display = 'none';
        
        try {
            // Obtener USDT/VES de GitHub
            const resVES = await fetch(TASA_USDTVES_URL + '?t=' + Date.now());
            const usdVES = parseFloat((await resVES.text()).trim());
            
            // Obtener USD/COP - API que se actualiza cada hora
            const resCOP = await fetch(API_COP_URL + '?t=' + Date.now()); // Cache buster
            const dataCOP = await resCOP.json();
            const usdCOP = dataCOP.rates.COP;
            
            // Calcular cruce
            tasaBase = usdCOP / usdVES;
            tasaActual = tasaBase;
            
            const fecha = new Date().toLocaleString('es-VE');
            fechaDisplay.innerText = `Actualizado: ${fecha}`;
            tasaDisplay.innerHTML = `USD/COP: ${usdCOP.toFixed(1)} | USDT/VES: ${usdVES}<br><strong>Tasa: ${tasaBase.toFixed(1)} COP/Bs</strong>`;
            
            tasaActualDisplay.innerText = tasaBase.toFixed(1); // 1 DECIMAL
            slider.value = 50;
            generarBotones();
        } catch (e) {
            alertBox.style.display = 'block';
            tasaDisplay.innerText = "⚠️ Error de conexión";
        }
    }

    function generarBotones() {
        botonesRapidos.innerHTML = '';
        const valores = [tasaBase-0.5, tasaBase-0.3, tasaBase-0.1, tasaBase, tasaBase+0.1, tasaBase+0.3, tasaBase+0.5];
        valores.forEach(v => {
            const btn = document.createElement('button');
            btn.innerText = Math.max(0, v).toFixed(1); // 1 DECIMAL
            btn.onclick = () => { tasaActual = Math.max(0, v); tasaActualDisplay.innerText = v.toFixed(1); slider.value = 50; };
            if (Math.abs(v - tasaBase) < 0.05) btn.classList.add('active');
            botonesRapidos.appendChild(btn);
        });
    }

    vesInput.addEventListener('input', () => { if (tasaActual > 0) copInput.value = (vesInput.value * tasaActual).toFixed(0); });
    copInput.addEventListener('input', () => { if (tasaActual > 0) vesInput.value = (copInput.value / tasaActual).toFixed(2); });
</script>

</body>
</html>
