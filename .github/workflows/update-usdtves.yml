name: Actualizar Tasa USDT/VES

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-usdtves:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Extraer tasa
        run: |
          curl -s -X POST "https://api.binance.com/bapi/adv/v1/public/adv/adv/navigate" -H "Content-Type: application/json" -d '{"asset":"USDT","fiat":"VES","tradeType":"SELL"}' > binance.json
          
      - name: Procesar
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('binance.json', 'utf8'));
              let tasa = 943; // valor por defecto
              
              if (data.data && data.data.advList && data.data.advList.length > 0) {
                const precios = data.data.advList.slice(0, 5)
                  .map(a => parseFloat(a.adv.price))
                  .filter(p => p > 500 && p < 2000);
                
                if (precios.length > 0) {
                  tasa = precios.reduce((a, b) => a + b, 0) / precios.length;
                }
              }
              
              fs.writeFileSync('tasa_usdtves.csv', tasa.toFixed(2));
              console.log('Tasa:', tasa.toFixed(2));
            } catch (e) {
              fs.writeFileSync('tasa_usdtves.csv', '943');
              console.log('Error, usando 943');
            }
      
      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa_usdtves.csv
          git commit -m "Actualizacion USDT/VES" || echo "Sin cambios"
          git push
