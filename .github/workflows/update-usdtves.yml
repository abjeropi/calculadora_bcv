name: Actualizar Tasa USDT/VES

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-usdtves:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extraer tasa USDT/VES
        run: |
          echo "Descargando datos de Binance..."
          
          # Intentar obtener de API de Binance
          RESPONSE=$(curl -s -X POST "https://api.binance.com/bapi/adv/v1/public/adv/adv/navigate" \
            -H "Content-Type: application/json" \
            -d '{"asset":"USDT","fiat":"VES","tradeType":"SELL"}' || echo "{}")
          
          # Extraer tasa con Python
          TASA=$(python3 -c "
import json
import sys

try:
    data = json.loads('''$RESPONSE''')
    if 'data' in data and 'advList' in data['data'] and len(data['data']['advList']) > 0:
        precios = []
        for adv in data['data']['advList'][:5]:
            try:
                price = float(adv['adv']['price'])
                if 500 < price < 2000:
                    precios.append(price)
            except:
                pass
        if len(precios) > 0:
            promedio = sum(precios) / len(precios)
            print(round(promedio, 2))
            sys.exit(0)
except:
    pass

# Valor de respaldo
print(943)
")
          
          echo "Tasa USDT/VES: $TASA"
          echo "$TASA" > tasa_usdtves.csv
          cat tasa_usdtves.csv
          
      - name: Commit a GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa_usdtves.csv
          git commit -m "USDT/VES: $(cat tasa_usdtves.csv)" || echo "Sin cambios"
          git push origin main
          echo "Completado!"
