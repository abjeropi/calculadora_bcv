name: Actualizar Tasa USDT/VES

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-usdtves:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Extraer tasa de Binance
        run: |
          echo "Descargando página de Binance..."
          curl -k -s "https://www.binance.com/es-LA/price/tether/VES" -o binance.html -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          
          echo "Extrayendo tasa del JSON..."
          
          python3 << 'EOF'
          import re
          import json
          
          with open('binance.html', 'r', encoding='utf-8') as f:
              html = f.read()
          
          # Buscar el script __APP_DATA
          match = re.search(r'<script id="__APP_DATA" type="application/json">(.*?)</script>', html, re.DOTALL)
          
          if not match:
              print("ERROR: No se encontró __APP_DATA")
              exit(1)
          
          json_str = match.group(1)
          data = json.loads(json_str)
          
          # Navegar al valor c2cConvertData.price
          price = data.get('appState', {}).get('loader', {}).get('dataByRouteId', {}).get('082e', {}).get('c2cConvertData', {}).get('price')
          
          if not price:
              print("ERROR: No se encontró c2cConvertData.price")
              exit(1)
          
          print(f"Tasa encontrada: {price}")
          
          with open('tasa_usdtves.csv', 'w') as f:
              f.write(str(price))
          
          print(f"✅ Guardado: {price}")
          EOF
      
      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa_usdtves.csv
          git commit -m "USDT/VES: $(cat tasa_usdtves.csv)" || echo "Sin cambios"
          git push
