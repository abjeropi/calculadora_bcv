name: Actualizar Tasa USDT/VES

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-usdtves:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Descargar usdt.com.ve
        run: |
          curl -k -s "https://www.usdt.com.ve/" -o usdt.html -H "User-Agent: Mozilla/5.0"
      
      - name: Extraer tasa
        run: |
          python3 << 'EOF'
          import re
          
          with open('usdt.html', 'r', encoding='utf-8') as f:
              html = f.read()
          
          # Buscar "Dólar Binance Hoy en Venezuela: 940,32"
          match = re.search(r'Dólar Binance.*?([0-9]+[.,][0-9]+)\s*por\s*USDT', html)
          
          if match:
              tasa = match.group(1).replace(',', '.')
              print(f"Tasa encontrada: {tasa}")
              
              with open('tasa_usdtves.csv', 'w') as f:
                  f.write(tasa)
          else:
              print("ERROR: No se encontró la tasa")
              exit(1)
          EOF
      
      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa_usdtves.csv
          git commit -m "USDT/VES: $(cat tasa_usdtves.csv)" || echo "Sin cambios"
          git push
