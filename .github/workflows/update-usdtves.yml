name: Actualizar Tasa USDT/VES

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-usdtves:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-lxml
      
      - name: Scraping Binance
        run: |
          echo "Descargando página de Binance..."
          curl -k -s "https://www.binance.com/es-AR/price/tether/VES" -o binance.html -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          
          python3 << 'EOF'
          from lxml import html
          import re
          
          try:
              with open('binance.html', 'r', encoding='utf-8') as f:
                  tree = html.fromstring(f.read())
              
              # Buscar el valor USDT/VES en la página
              # Binance suele mostrarlo en formato: "942.75 VES" o similar
              texto = tree.text_content()
              
              # Buscar patrón de número con decimales seguido de VES
              match = re.search(r'(\d+[.,]\d{2})\s*VES', texto)
              
              if match:
                  tasa_str = match.group(1).replace(',', '.')
                  tasa = float(tasa_str)
                  
                  if 500 < tasa < 2000:
                      print(f"Tasa encontrada: {tasa}")
                      with open('tasa_usdtves.csv', 'w') as f:
                          f.write(f"{tasa:.2f}")
                  else:
                      print(f"Valor fuera de rango: {tasa}")
                      with open('tasa_usdtves.csv', 'w') as f:
                          f.write("943.00")
              else:
                  print("No se encontró el patrón")
                  with open('tasa_usdtves.csv', 'w') as f:
                      f.write("943.00")
          except Exception as e:
              print(f"Error: {e}")
              with open('tasa_usdtves.csv', 'w') as f:
                  f.write("943.00")
          EOF
      
      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa_usdtves.csv
          git commit -m "USDT/VES: $(cat tasa_usdtves.csv)" || echo "Sin cambios"
          git push
