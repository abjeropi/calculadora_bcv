name: Actualizar Tasa USDT/VES

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
  workflow_dispatch:

jobs:
  update-usdtves:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Extraer tasa de Binance
        run: |
          curl -k -s "https://www.binance.com/es-LA/price/tether/VES" -o binance.html -H "User-Agent: Mozilla/5.0"
          
          python3 << 'EOF'
import json
import re

with open('binance.html', 'r', encoding='utf-8') as f:
    html = f.read()

# Buscar el script __APP_DATA
match = re.search(r'<script id="__APP_DATA"[^>]*>(.*?)</script>', html, re.DOTALL)

if not match:
    print("ERROR: No se encontró __APP_DATA")
    exit(1)

data = json.loads(match.group(1))

# Navegar al c2cConvertData.price
price = data['appState']['loader']['dataByRouteId']['082e']['coin']['c2cConvertData']['price']

print(f"Tasa encontrada: {price}")

with open('tasa_usdtves.csv', 'w') as f:
    f.write(str(price))

print(f"✅ Guardado: {price}")
EOF
      
      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa_usdtves.csv
          git commit -m "USDT/VES: $(cat tasa_usdtves.csv)" || echo "Sin cambios"
          git push
