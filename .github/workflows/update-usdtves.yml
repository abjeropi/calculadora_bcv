name: Actualizar Tasa USDT/VES

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
  workflow_dispatch:

jobs:
  update-usdtves:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Extraer tasa
        run: |
          curl -k -s "https://www.binance.com/es-LA/price/tether/VES" -o binance.html -H "User-Agent: Mozilla/5.0"
          
          # Buscar el patrón "price":942.745 en el JSON
          TASA=$(grep -oP '"price":\s*\K[0-9]+\.[0-9]+' binance.html | head -1)
          
          if [ -z "$TASA" ]; then
            echo "ERROR: No se encontró la tasa"
            exit 1
          fi
          
          echo "Tasa encontrada: $TASA"
          echo "$TASA" > tasa_usdtves.csv
          cat tasa_usdtves.csv
      
      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa_usdtves.csv
          git commit -m "USDT/VES: $(cat tasa_usdtves.csv)" || echo "Sin cambios"
          git push
