name: Actualizar Tasa USDT/VES

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-usdtves:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Extraer tasa de Binance
        run: |
          echo "Descargando página de Binance..."
          curl -k -s "https://www.binance.com/es-LA/price/tether/VES" -o binance.html -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          
          echo "Extrayendo tasa del JSON embebido..."
          
          python3 << 'EOF'
          import re
          import json
          
          with open('binance.html', 'r', encoding='utf-8') as f:
              html = f.read()
          
          # Buscar el JSON de c2cConvertData
          match = re.search(r'"c2cConvertData":\s*\{[^}]*"price":\s*([\d.]+)', html)
          
          if match:
              price = float(match.group(1))
              print(f"Tasa encontrada: {price}")
              
              # Validar que esté en rango razonable (500-2000)
              if 500 < price < 2000:
                  with open('tasa_usdtves.csv', 'w') as f:
                      f.write(f"{price:.3f}")
                  print(f"✅ Guardado: {price:.3f}")
              else:
                  print(f" Valor fuera de rango: {price}")
                  exit(1)
          else:
              print(" No se encontró c2cConvertData en el HTML")
              exit(1)
          EOF
      
      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa_usdtves.csv
          git commit -m "USDT/VES: $(cat tasa_usdtves.csv)" || echo "Sin cambios"
          git push
