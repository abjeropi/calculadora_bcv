name: Actualizar Tasa BCV

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-tasa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Descargar página del BCV
        run: |
          echo "Descargando página del BCV..."
          curl -k -s "https://www.bcv.org.ve/" -o bcv.html -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          echo "Tamaño del archivo:"
          ls -lh bcv.html
          echo ""
          echo "=== Primeras 500 líneas del HTML ==="
          head -500 bcv.html
          echo ""
          echo "=== Buscando números con cualquier formato ==="
          grep -oP '[0-9]+[.,][0-9]+' bcv.html | head -30
      
      - name: Extraer tasa del dólar USD
        id: extract
        run: |
          echo "Extrayendo tasa del DÓLAR..."
          
          # Mostrar todos los números encontrados
          echo "=== Todos los números con decimales ==="
          grep -oP '[0-9]+[.,][0-9]+' bcv.html | sort -u | head -50
          
          # Buscar específicamente el valor del dólar (784.xxxx o similar)
          # El BCV muestra: 784,66330000 (con coma como decimal)
          TASA=$(grep -oP '[0-9]{3}[.,][0-9]{4,}' bcv.html | head -1 || echo "")
          
          echo ""
          echo "=== Valor encontrado: $TASA ==="
          echo "tasa=$TASA" >> $GITHUB_OUTPUT
          
          if [ -z "$TASA" ]; then
            echo "ERROR: No se encontró la tasa"
            echo "Buscando patrones alternativos..."
            grep -oP '[0-9]{2,}[.,][0-9]{2,}' bcv.html | head -20
            exit 1
          fi
          
          # Normalizar: cambiar coma por punto si es necesario
          TASA=$(echo $TASA | tr ',' '.')
          
          # Guardar en archivo
          echo $TASA > tasa.csv
          echo "✅ Tasa guardada: $TASA"
          cat tasa.csv
          
      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add tasa.csv
          git commit -m "BCV USD: $(cat tasa.csv) - $(date '+%Y-%m-%d %H:%M')" || echo "Sin cambios"
          git push origin main
          
          echo "✅ ¡Listo!"
