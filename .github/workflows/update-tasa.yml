name: Actualizar Tasa BCV

on:
  schedule:
    - cron: '0 12 * * *'  # Todos los días a las 8am Venezuela (12:00 UTC)
  workflow_dispatch:  # Permite ejecutarlo manualmente si quieres

jobs:
  update-tasa:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Descargar página del BCV
        run: |
          curl -s "https://www.bcv.org.ve/" -o bcv.html -H "User-Agent: Mozilla/5.0"
      
      - name: Extraer tasa del dólar
        run: |
          # Buscar el valor en el HTML
          # El BCV tiene algo como: <div id="dolar"><strong>784,66330000</strong></div>
          
          TASA=$(grep -oP '(?<=<div[^>]*id="dolar"[^>]*>.*?<strong>)[0-9.,]+' bcv.html | head -1)
          
          # Si no lo encontró con id="dolar", buscar por "USD"
          if [ -z "$TASA" ]; then
            TASA=$(grep -oP 'USD.*?[0-9]+[.,][0-9]+' bcv.html | grep -oP '[0-9]+[.,][0-9]+' | head -1)
          fi
          
          # Limpiar: cambiar coma por punto si es necesario
          TASA=$(echo $TASA | tr ',' '.')
          
          echo "Tasa encontrada: $TASA"
          echo $TASA > tasa.csv
          
      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tasa.csv
          git commit -m "Actualización automática BCV $(date +%Y-%m-%d)" || echo "Sin cambios"
          git push
