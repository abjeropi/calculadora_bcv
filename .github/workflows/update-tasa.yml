name: Actualizar Tasa BCV

on:
  schedule:
    # Cada 2 horas desde 6 AM hasta 8 PM (hora Venezuela = UTC-4)
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'  # Medianoche
  workflow_dispatch:

jobs:
  update-tasa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Descargar página del BCV
        run: |
          echo "Descargando página del BCV..."
          curl -k -s "https://www.bcv.org.ve/" -o bcv.html -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          echo "Descarga completada"
      
      - name: Extraer tasa del dólar USD (5to valor grande)
        id: extract
        run: |
          echo "Extrayendo tasas del BCV..."
          
          # Extraer TODOS los números con formato de tasa (3+ dígitos, punto, 4+ dígitos)
          # Esto captura valores como: 916.00808978, 116.75668477, 784.66330000, etc.
          echo "=== Todos los valores encontrados ==="
          grep -oP '[0-9]{3,}\.[0-9]{4,}' bcv.html | head -20
          
          # Tomar el 5to valor (que es el USD según el orden del BCV)
          TASA=$(grep -oP '[0-9]{3,}\.[0-9]{4,}' bcv.html | sed -n '5p')
          
          echo ""
          echo "=== Valor seleccionado (5to): $TASA ==="
          echo "tasa=$TASA" >> $GITHUB_OUTPUT
          
          if [ -z "$TASA" ]; then
            echo "ERROR: No se pudo extraer el 5to valor"
            echo "Total de valores encontrados:"
            grep -oP '[0-9]{3,}\.[0-9]{4,}' bcv.html | wc -l
            exit 1
          fi
          
          # Validar que sea un número razonable (entre 100 y 10000)
          if ! echo "$TASA" | grep -qP '^[0-9]{3,4}\.[0-9]+$'; then
            echo "ERROR: El valor extraído no parece válido: $TASA"
            exit 1
          fi
          
          # Guardar en archivo
          echo $TASA > tasa.csv
          echo "✅ Archivo tasa.csv actualizado con: $TASA"
          cat tasa.csv
          
      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add tasa.csv
          git commit -m "Actualización BCV USD: $(cat tasa.csv) - $(date '+%Y-%m-%d %H:%M')" || echo "Sin cambios"
          git push origin main
          
          echo "✅ ¡Actualización completada!"
