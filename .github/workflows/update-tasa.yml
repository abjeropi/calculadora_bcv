name: Actualizar Tasa BCV

on:
  schedule:
    - cron: '0 12 * * *'  # Todos los días a las 8am Venezuela (12:00 UTC)
  workflow_dispatch:  # Permite ejecutarlo manualmente

jobs:
  update-tasa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Descargar página del BCV
        run: |
          echo "Descargando página del BCV..."
          curl -k -s "https://www.bcv.org.ve/" -o bcv.html -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          echo "Descarga completada"
          ls -la bcv.html
      
      - name: Extraer tasa del dólar USD
        id: extract
        run: |
          echo "Extrayendo tasa del DÓLAR (USD)..."
          
          # Mostrar el HTML relevante para debug
          echo "=== Buscando sección de tasas ==="
          grep -i "usd\|dólar\|dollar" bcv.html | head -20
          
          # Método 1: Buscar específicamente USD seguido de su valor
          # El BCV tiene una estructura como: <td>USD</td><td>784.66330000</td>
          TASA=$(grep -oP 'USD[^0-9]*\K[0-9]+\.[0-9]+' bcv.html | head -1 || echo "")
          
          # Método 2: Si no funciona, buscar por símbolo $
          if [ -z "$TASA" ]; then
            TASA=$(grep -oP '\$[^0-9]*\K[0-9]+\.[0-9]+' bcv.html | head -1 || echo "")
          fi
          
          # Método 3: Buscar en tabla específica de tasas
          if [ -z "$TASA" ]; then
            TASA=$(grep -A2 -B2 "USD" bcv.html | grep -oP '[0-9]+\.[0-9]+' | head -1 || echo "")
          fi
          
          echo "Tasa encontrada: $TASA"
          echo "tasa=$TASA" >> $GITHUB_OUTPUT
          
          if [ -z "$TASA" ]; then
            echo "ERROR: No se pudo extraer la tasa del USD del BCV"
            echo "=== Mostrando HTML relevante ==="
            grep -i "usd\|euro\|eur" bcv.html | head -30
            exit 1
          fi
          
          # Guardar en archivo
          echo $TASA > tasa.csv
          echo "Archivo tasa.csv creado con: $TASA"
          cat tasa.csv
          
      - name: Guardar cambios en GitHub
        run: |
          echo "Configurando git..."
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          echo "Agregando cambios..."
          git add tasa.csv
          
          echo "Haciendo commit..."
          git commit -m "Actualización automática BCV USD $(date +%Y-%m-%d)" || echo "Sin cambios nuevos"
          
          echo "Haciendo push..."
          git push origin main
          
          echo "¡Listo!"
