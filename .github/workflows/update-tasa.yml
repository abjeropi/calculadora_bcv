name: Actualizar Tasa BCV

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-tasa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Instalar Python y lxml
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-lxml
          echo "Instalación completada"
      
      - name: Descargar y extraer tasa del BCV
        id: extract
        run: |
          echo "Descargando página del BCV..."
          
          # Descargar la página
          curl -k -s "https://www.bcv.org.ve/" -o bcv.html -H "User-Agent: Mozilla/5.0"
          
          echo "Extrayendo tasa con XPath (igual que Google Sheets)..."
          
          # Usar Python con lxml para hacer el mismo XPath que Google Sheets
          python3 << 'EOF'
          from lxml import html
          import re
          
          # Leer el HTML
          with open('bcv.html', 'r', encoding='utf-8') as f:
              tree = html.fromstring(f.read())
          
          # Usar el MISMO XPath que tu fórmula de Google Sheets
          # //div[@id='dolar']//strong
          elementos = tree.xpath("//div[@id='dolar']//strong")
          
          if elementos:
              valor = elementos[0].text_content().strip()
              print(f"Valor encontrado: {valor}")
              
              # Limpiar el valor (quitar puntos de miles)
              valor_limpio = valor.replace('.', '')
              
              # Dividir entre 100000000 como hace tu fórmula
              try:
                  tasa = float(valor_limpio) / 100000000
                  print(f"Tasa calculada: {tasa}")
                  
                  # Guardar en archivo
                  with open('tasa.csv', 'w') as f:
                      f.write(str(tasa))
                  
                  print(f"✅ Archivo tasa.csv creado con: {tasa}")
              except ValueError as e:
                  print(f"ERROR al convertir: {valor_limpio}")
                  print(f"Error: {e}")
                  exit(1)
          else:
              print("ERROR: No se encontró el div con id='dolar'")
              print("Buscando todos los divs disponibles...")
              todos_divs = tree.xpath("//div[@id]")
              for div in todos_divs[:10]:
                  print(f"  - {div.get('id')}")
              exit(1)
          EOF
          
          # Mostrar el resultado
          echo ""
          echo "=== Contenido de tasa.csv ==="
          cat tasa.csv
      
      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add tasa.csv
          git commit -m "BCV USD: $(cat tasa.csv) - $(date '+%Y-%m-%d %H:%M')" || echo "Sin cambios"
          git push origin main
          
          echo "✅ ¡Actualización completada!"
