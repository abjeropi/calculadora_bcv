name: Actualizar Tasa BCV

on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-tasa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Instalar Python y lxml
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-lxml
      
      - name: Descargar y extraer tasa del BCV
        id: extract
        run: |
          echo "Descargando página del BCV..."
          
          curl -k -s "https://www.bcv.org.ve/" -o bcv.html -H "User-Agent: Mozilla/5.0"
          
          echo "Extrayendo tasa con XPath..."
          
          python3 << 'EOF'
          from lxml import html
          
          with open('bcv.html', 'r', encoding='utf-8') as f:
              tree = html.fromstring(f.read())
          
          # Mismo XPath que Google Sheets
          elementos = tree.xpath("//div[@id='dolar']//strong")
          
          if elementos:
              valor = elementos[0].text_content().strip()
              print(f"Valor encontrado: {valor}")
              
              # Quitar puntos de miles (si los hay)
              valor_sin_puntos = valor.replace('.', '')
              print(f"Sin puntos: {valor_sin_puntos}")
              
              # Reemplazar coma por punto para decimal
              valor_final = valor_sin_puntos.replace(',', '.')
              print(f"Valor final: {valor_final}")
              
              # Guardar SIN dividir
              with open('tasa.csv', 'w') as f:
                  f.write(valor_final)
              
              print(f"✅ tasa.csv: {valor_final}")
          else:
              print("ERROR: No se encontró div#dolar")
              exit(1)
          EOF
      
      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add tasa.csv
          git commit -m "BCV: $(cat tasa.csv)" || echo "Sin cambios"
          git push origin main
          
          echo "✅ ¡Listo!"
