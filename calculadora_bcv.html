<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora BCV</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
        body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .container { background-color: rgba(45, 45, 45, 0.95); padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #00e676; margin-top: 0; font-size: 1.8em; }
        .tasa-info { text-align: center; font-size: 0.95em; background-color: #1e1e1e; padding: 10px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #00e676; }
        .fecha-actualizacion { font-size: 0.8em; color: #888; margin-top: 5px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #ccc; font-size: 0.9em; }
        input { width: 100%; padding: 14px; font-size: 1.3em; border: 2px solid #444; border-radius: 10px; background-color: #1e1e1e; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #00e676; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .refresh-btn, .manual-btn, .force-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .refresh-btn { background-color: #00e676; color: #1e1e1e; }
        .manual-btn { background-color: #ff9800; color: #1e1e1e; }
        .force-btn { background-color: #2196F3; color: white; margin-top: 10px; width: 100%; }
        .alert { background-color: #ff5722; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85em; text-align: center; display: none; }
        .source-tag { font-size: 0.7em; color: #666; margin-top: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora BCV</h2>
    <div class="alert" id="alert">️ Error al obtener tasa</div>
    
    <div class="tasa-info" id="tasa-display">
        Cargando...
        <div class="fecha-actualizacion" id="fecha-display"></div>
        <div class="source-tag" id="source-display"></div>
    </div>
    
    <div class="input-group">
        <label for="usd">🇺🇸 Dólares (USD)</label>
        <input type="number" id="usd" placeholder="0.00" step="0.01">
    </div>

    <div class="input-group">
        <label for="ves">🇪 Bolívares (VES)</label>
        <input type="number" id="ves" placeholder="0.00" step="0.01">
    </div>

    <div class="input-group">
        <label for="tasa-manual">⚙️ Tasa BCV (Bs/$)</label>
        <input type="number" id="tasa-manual" placeholder="Ej: 784.66" step="0.01">
    </div>

    <div class="btn-group">
        <button class="refresh-btn" onclick="obtenerTasaBCV(false)">🔄 Actualizar</button>
        <button class="manual-btn" onclick="guardarTasaManual()">💾 Guardar</button>
    </div>
    <button class="force-btn" onclick="forzarActualizacion()">⚡ Forzar actualización</button>
</div>

<script>
    const TASA_URL = "https://raw.githubusercontent.com/abjeropi/calculadora_bcv/main/tasa.csv";

    let tasaBCV = 0;
    const usdInput = document.getElementById('usd');
    const vesInput = document.getElementById('ves');
    const tasaDisplay = document.getElementById('tasa-display');
    const fechaDisplay = document.getElementById('fecha-display');
    const sourceDisplay = document.getElementById('source-display');
    const tasaManualInput = document.getElementById('tasa-manual');
    const alertBox = document.getElementById('alert');

    window.onload = function() {
        const tasaGuardada = localStorage.getItem('tasaBCV');
        const fechaGuardada = localStorage.getItem('fechaBCV');
        const fechaGuardadaObj = fechaGuardada ? new Date(fechaGuardada) : null;
        const ahora = new Date();
        
        if (tasaGuardada && fechaGuardadaObj && (ahora - fechaGuardadaObj) < 24 * 60 * 60 * 1000) {
            tasaBCV = parseFloat(tasaGuardada);
            tasaManualInput.value = tasaBCV;
            actualizarDisplay(`Tasa guardada: ${tasaBCV} Bs/$`, fechaGuardada, 'Memoria local (< 24h)');
        } else {
            tasaDisplay.innerHTML = "⚠️ Tasa expirada, actualizando...";
        }
        obtenerTasaBCV(false);
    };

    async function obtenerTasaBCV(forzar = false) {
        if (!forzar) {
            tasaDisplay.innerHTML = "🔄 Buscando tasa...";
        } else {
            tasaDisplay.innerHTML = "⚡ Actualizando desde GitHub...";
        }
        sourceDisplay.innerText = "";
        
        try {
            const response = await fetch(TASA_URL + '?t=' + Date.now());
            
            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }
            
            const texto = await response.text();
            const tasa = parseFloat(texto.trim());
            
            if (!isNaN(tasa) && tasa > 100) {
                guardarYMostrar(tasa, 'GitHub Actions (auto)');
                return;
            }
            throw new Error("Tasa inválida: " + tasa);
            
        } catch (error) {
            console.error("Error:", error);
            alertBox.style.display = 'block';
            tasaDisplay.innerHTML = '⚠️ Error al obtener tasa';
            sourceDisplay.innerText = 'Usa el botón Forzar o ingresa manual';
        }
    }

    function forzarActualizacion() {
        localStorage.removeItem('tasaBCV');
        localStorage.removeItem('fechaBCV');
        obtenerTasaBCV(true);
    }

    function guardarYMostrar(tasa, fuente) {
        tasaBCV = tasa;
        const fecha = new Date().toLocaleString('es-VE');
        localStorage.setItem('tasaBCV', tasa);
        localStorage.setItem('fechaBCV', fecha);
        tasaManualInput.value = tasa;
        actualizarDisplay(`✅ BCV: ${tasa.toFixed(2)} Bs/$`, fecha, `Fuente: ${fuente}`);
        alertBox.style.display = 'none';
        if(usdInput.value) calcularDesdeUSD();
        else if(vesInput.value) calcularDesdeVES();
    }

    function guardarTasaManual() {
        const tasaIngresada = parseFloat(tasaManualInput.value);
        if (tasaIngresada > 0) {
            tasaBCV = tasaIngresada;
            const fecha = new Date().toLocaleString('es-VE');
            localStorage.setItem('tasaBCV', tasaBCV);
            localStorage.setItem('fechaBCV', fecha);
            actualizarDisplay(`💾 Tasa manual: ${tasaBCV.toFixed(2)} Bs/$`, fecha, 'Ingresada por usuario');
            alertBox.style.display = 'none';
            if(usdInput.value) calcularDesdeUSD();
            else if(vesInput.value) calcularDesdeVES();
        }
    }

    function calcularDesdeUSD() { 
        if (tasaBCV > 0 && usdInput.value) {
            vesInput.value = (usdInput.value * tasaBCV).toFixed(2); 
        } 
    }
    
    function calcularDesdeVES() { 
        if (tasaBCV > 0 && vesInput.value) {
            usdInput.value = (vesInput.value / tasaBCV).toFixed(2); 
        } 
    }
    
    function actualizarDisplay(mensaje, fecha, fuente) { 
        tasaDisplay.innerHTML = `${mensaje}<div class="fecha-actualizacion">${fecha}</div>`;
        sourceDisplay.innerText = fuente || '';
    }

    usdInput.addEventListener('input', calcularDesdeUSD);
    vesInput.addEventListener('input', calcularDesdeVES);
    
    setInterval(() => obtenerTasaBCV(false), 5 * 60 * 1000);
</script>

</body>
</html>
